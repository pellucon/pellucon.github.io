<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Enterprise MCP Proxy logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#0D9488"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>
  <!-- backend MCP servers fanning into the gateway -->
  <g stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
    <line x1="15" y1="17" x2="30" y2="32"/>
    <line x1="13" y1="32" x2="30" y2="32"/>
    <line x1="15" y1="47" x2="30" y2="32"/>
    <line x1="42" y1="32" x2="52" y2="32"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="15" cy="17" r="4"/>
    <circle cx="13" cy="32" r="4"/>
    <circle cx="15" cy="47" r="4"/>
    <!-- single client-facing endpoint -->
    <circle cx="52" cy="32" r="4"/>
  </g>
  <!-- the gateway: a shield -->
  <path d="M36 20 L45 23.5 V31 C45 37.5 41 41.5 36 44 C31 41.5 27 37.5 27 31 V23.5 Z" fill="#FFFFFF"/>
  <path d="M32 31.5 L35 34.5 L40.5 28.5" fill="none" stroke="#4F46E5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
